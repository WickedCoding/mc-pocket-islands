# Automatically build the project and run any configured tests for every push
# and submitted pull request. Uses Stonecutter to build all supported MC versions.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build all versions
        run: ./gradlew chiseledBuild

      - name: Run tests for all versions
        run: ./gradlew chiseledTest

      - name: Run in-game tests for all versions
        run: ./gradlew chiseledGameTest

      - name: Run restart and world-reset harness for all versions
        run: ./gradlew chiseledHarnessTest

      - name: Capture in-game test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: In-Game-Test-Reports
          path: |
            versions/*/build/gametest/junit.xml
            versions/*/build/gametest/logs/latest.log
            versions/*/build/harness/harness-report.properties
            versions/*/build/harness/logs/latest.log

      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build-Artifacts
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-dev.jar
