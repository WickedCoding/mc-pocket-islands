# Automatically create a GitHub Release when a version tag is pushed.
# Builds all MC versions using Stonecutter and attaches all JAR variants to the release.
#
# Usage:
#   git tag v0.4.0
#   git push origin main --tags

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all versions
        run: ./gradlew chiseledBuild

      - name: Get mod version
        id: mod_version
        run: |
          VERSION=$(grep -oP 'mod_version=\K.*' gradle.properties)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          MOD_VERSION="${{ steps.mod_version.outputs.version }}"

          # Extract section between "## [X.Y.Z]" and the next "## [" header
          # Uses awk to capture lines between version headers
          CHANGELOG=$(awk -v ver="$MOD_VERSION" '
            BEGIN { found=0; content="" }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { content = content $0 "\n" }
            END { print content }
          ' CHANGELOG.md)

          # Handle multi-line output for GitHub Actions
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Debug output
          echo "Extracted changelog for v$MOD_VERSION:"
          echo "$CHANGELOG"

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          MOD_VERSION="${{ steps.mod_version.outputs.version }}"

          # Dynamically find and rename all built JARs
          for version_dir in versions/*/; do
            mc_version=$(basename "$version_dir")
            jar_path="${version_dir}build/libs/personalworlds-${MOD_VERSION}.jar"
            sources_path="${version_dir}build/libs/personalworlds-${MOD_VERSION}-sources.jar"

            if [ -f "$jar_path" ]; then
              cp "$jar_path" "release-artifacts/personalworlds-${MOD_VERSION}+${mc_version}.jar"
            fi

            if [ -f "$sources_path" ]; then
              cp "$sources_path" "release-artifacts/personalworlds-${MOD_VERSION}+${mc_version}-sources.jar"
            fi
          done

          echo "Release artifacts:"
          ls -la release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          fail_on_unmatched_files: false
          files: |
            release-artifacts/*.jar

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: ./gradlew chiseledPublishModrinth
