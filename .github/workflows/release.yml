# Automatically create a GitHub Release when a version tag is pushed.
# Builds all MC versions using Stonecutter and attaches all JAR variants to the release.
#
# Usage:
#   git tag v0.4.0
#   git push origin main --tags

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build all versions
        run: ./gradlew chiseledBuild

      - name: Get mod version
        id: mod_version
        run: |
          VERSION=$(grep -oP 'mod_version=\K.*' gradle.properties)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          # Copy and rename JARs with MC version suffix
          cp versions/1.20.1/build/libs/personalworlds-${{ steps.mod_version.outputs.version }}.jar \
             release-artifacts/personalworlds-${{ steps.mod_version.outputs.version }}-mc1.20.1.jar
          cp versions/1.20.1/build/libs/personalworlds-${{ steps.mod_version.outputs.version }}-sources.jar \
             release-artifacts/personalworlds-${{ steps.mod_version.outputs.version }}-mc1.20.1-sources.jar
          cp versions/1.20.4/build/libs/personalworlds-${{ steps.mod_version.outputs.version }}.jar \
             release-artifacts/personalworlds-${{ steps.mod_version.outputs.version }}-mc1.20.4.jar
          cp versions/1.20.4/build/libs/personalworlds-${{ steps.mod_version.outputs.version }}-sources.jar \
             release-artifacts/personalworlds-${{ steps.mod_version.outputs.version }}-mc1.20.4-sources.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-artifacts/*.jar
